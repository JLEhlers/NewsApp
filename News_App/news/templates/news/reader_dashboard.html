{% extends "news/base.html" %}

{% block title %}Reader Dashboard{% endblock %}

{% block content %}

<div class="card shadow-sm">
    <div class="card-body">

        <h2 class="mb-3">Reader Dashboard</h2>

        <p class="text-muted">
            Welcome! Browse the latest news and newsletters.
        </p>

        <div class="d-flex flex-wrap gap-2 mt-4">
            <a href="{% url 'article_list' %}"
               class="btn btn-dark">
                Browse Articles
            </a>

            <a href="{% url 'newsletter_list' %}"
               class="btn btn-outline-dark">
                View Newsletters
            </a>
        </div>

    </div>
</div>

{% endblock %}
