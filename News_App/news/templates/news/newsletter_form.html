{% extends "news/base.html" %}

{% block content %}
<div class="container mt-4">
    <h2>
        {% if newsletter %}Edit Newsletter{% else %}Create Newsletter{% endif %}
    </h2>

    <form method="post">
        {% csrf_token %}

        <div class="mb-3">
            <label for="title" class="form-label">Title</label>
            <input
                type="text"
                name="title"
                id="title"
                class="form-control"
                value="{{ newsletter.title|default:'' }}"
                required
            >
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea
                name="description"
                id="description"
                class="form-control"
                rows="5"
                required
            >{{ newsletter.description|default:'' }}</textarea>
        </div>

        <div class="mb-3">
            <label class="form-label">Include approved articles</label>

            {% for article in articles %}
                <div class="form-check">
                    <input
                        type="checkbox"
                        class="form-check-input"
                        name="articles"
                        value="{{ article.id }}"
                        id="article{{ article.id }}"
                        {% if article in selected_articles %}checked{% endif %}
                    >
                    <label
                        class="form-check-label"
                        for="article{{ article.id }}"
                    >
                        {{ article.title }}
                    </label>
                </div>
            {% empty %}
                <p>No approved articles are available yet.</p>
            {% endfor %}
        </div>

        <button type="submit" class="btn btn-primary">
            Save Newsletter
        </button>
        <a href="{% url 'dashboard' %}" class="btn btn-secondary">
            Cancel
        </a>
    </form>
</div>
{% endblock %}
